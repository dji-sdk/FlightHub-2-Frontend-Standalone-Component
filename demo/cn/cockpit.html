<!-- 接入步骤：

* 示例中的 ip 地址 127.0.0.1 替换成实际用户服务地址 *

- 接入步骤 1 - 添加组件容器样式
- 接入步骤 2 - 引入 paas.js
- 接入步骤 3 - 提供组件所在的容器
- 接入步骤 4 - 使用组件前初始化配置
- 接入步骤 5 - 加载组件

- 接入步骤 6（按需） - 自定义地图元素
- 接入步骤 7（按需） - 自定义主题

具体步骤请查看下方 demo 里标明的各个地方 -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cockpit</title>
    <style>
        body,
        html {
            height: 100%;
            width: 100%;
            margin: 0;
            display: flex;
            flex-wrap: wrap;
        }

      .test-panel {
        position: fixed;
        bottom: 2%;
        left: 2%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        z-index: 9999;
        opacity: 1;
        background-color: #fff;
        padding: 10px;
        border-radius: 5px;
        gap: 8px;
        max-width: 300px;
      }

      .test-message {
        background-color: #ccc;
        padding: 4px;
        border-radius: 5px;
        word-break: break-all;
      }
      .test-panel-content {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .test-panel-close {
        position: absolute;
        right: 20px;
        top: 4px;
      }
      .test-panel-close::before,
      .test-panel-close::after {
        position: absolute;
        content: " ";
        background-color: #898989;
        width: 0px;
        height: 13px;
        border: 1px solid;
        left: 9px;
        top: 2px;
        cursor: pointer;
      }
      .test-panel-close::before {
        transform: rotate(45deg);
      }

      .test-panel-close::after {
        transform: rotate(-45deg);
      }
      .test-panel-open {
        display: none;
      }
    </style>

    <!-- ******* 接入步骤 1 - START：添加组件容器样式 *******  -->
    <style>
        .fh2-container {
            display: flex;
            flex-direction: column;
            /* 设置成你想要加载组件所在容器的宽高 */
            height: 100vh;
            width: 100vw;
        }

        #project-app-container>div, #cockpit-app-container>div,
        .map-app-container>div {
            width: 100%;
            height: 100%;
        }

        .project-details {
            position: relative;
            width: 100%;
            display: flex;
            flex: 1;
            overflow: auto;
        }

        .project-details .right-micro-app {
            position: relative;
            display: flex;
            flex: 1;
        }

        .project-details .right-micro-app .maps-micro-app {
            display: flex;
            flex: 1;
            position: relative;
        }

        .project-details .right-micro-app .map-app-placeholder {
            flex: 1;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .project-details .right-micro-app .map-app-container {
            height: 100%;
        }
    </style>
    <!-- ******* 接入步骤 1 - END：添加组件容器样式 *******  -->

    <!-- ******* 接入步骤 2 - START：引入 paas.js（具体域名地址请按实际替换） ******* -->
    <script src="http://127.0.0.1/paas.js" fh2></script>
    <!-- ******* 接入步骤 2 - END：引入 paas.js（具体域名地址请按实际替换） ******* -->

    <!-- ******* 接入步骤 7（按需） - START：自定义主题 ******* -->
    <link href="./custom-style.css" rel="stylesheet">

    <!-- ******* 接入步骤 7（按需） - END：自定义主题 ******* -->
</head>

<body>
    <!-- ******* 接入步骤 3 - START：提供组件所在的容器 ******* -->
    <div class="fh2-container">
        <div id="cockpit-header-container"></div>
        <div class="project-details router-cockpit">
            <div id="project-app-container"></div>
            <div id="project-middle-container"></div>
            <div id="project-right-micro-app" class="right-micro-app">
                <div class="maps-micro-app">
                    <div class="cockpit-left-border-container"></div>
                    <div id="project-map-app-placeholder" class="map-app-placeholder">
                        <div class="cockpit-dock-live-container"></div>
                        <div id="map-app-global" class="map-app-container"></div>
                        <div class="cockpit-bottom-border-container"></div>
                    </div>
                </div>
                <div class="project-right">
                    <div id="cockpit-app-container"></div>
                </div>
            </div>
        </div>
    </div>
    <!-- ******* 接入步骤 3 - END：提供组件所在的容器 ******* -->

    <script>
        const ip = '127.0.0.1'
        let cockpit1 = null; // 可能初始化多个 驾驶舱实例
        window.addEventListener('load', function () {
            // ******* 接入步骤 4 - START：使用组件前初始化配置（具体配置参数请按实际替换） *******
            window.FH2.initConfig({
                serverUrl: `http://${ip}:30812`,
                wssUrl: `ws://${ip}:30812/duplex/web`,
                hostUrl: `http://${ip}`,
                prjId: '', // 项目 id，按实际传入
                projectToken: '' // 组织密钥，按实际传入
            })
            // ******* 接入步骤 4 - END：使用组件前初始化配置（具体配置参数请按实际替换） *******

            // ******* 接入步骤 5 - START：加载组件，传入航线ID *******
            cockpit1 = window.FH2.loadCockpit("cockpit-app-container", {
                gateway_sn: '', // 网关 sn，按实际传入
                drone_sn: '' // 飞机 sn，按实际传入
            });
            // ******* 接入步骤 5 - END：加载组件，传入航线ID *******

            window.FH2.subscribe("cockpit:drone-take-off", (data) => {});
            window.FH2.subscribe("cockpit:camera-take-photo", ({cameraIndex}) => {}); // 事件 emit： 照片拍摄回调，（调用时机：发送请求前）
            window.FH2.subscribe("cockpit:camera-record-before", ({cameraIndex}) => {}); // 事件 emit： 录像开始回调
            window.FH2.subscribe("cockpit:camera-record-after", ({cameraIndex}) => {}); // 事件 emit： 录像结束回调
            window.FH2.subscribe("cockpit:camera-take-panoramic-before", (data) => {}); // 事件 emit： 全景照片拍摄开始回调
            window.FH2.subscribe("cockpit:camera-take-panoramic-after", ({cameraIndex}) => {}); // 事件 emit： 全景照片拍摄强制结束回调

            window.FH2.subscribe("cockpit:mounted", ({droneSn}) => {}); // 生命周期：驾驶舱挂载回调
        })
    </script>


    <!-- *******  START：Demo ******* -->
    <div class="test-panel">
      <div class="test-panel-action-list">
        <button class="test-panel-open" onclick="openDemo()">
          打开 demo 演示
        </button>
        <div class="test-panel-close" onclick="closeDemo()"></div>
      </div>
      <div class="test-panel-content">
        <div class="test-message">
          <div>预览:</div>
          <div class="message-info"></div>
          <image class="massage-img" style="width: 100%; height: auto" />
        </div>
        <button id="CesiumMapBtn" onclick="addCustomCesiumData()">
          地图定制
        </button>
        <button onclick="changeTheme()">样式定制</button>
        <button onclick="getVideoTypeTest()">获取 VideoType(zoom、ir、wide)</button>
        <button onclick="captureVideoFrameTest()">主摄直播截图</button>
      </div>
    </div>

    <script>
      function openDemo() {
        document.querySelector(".test-panel-content").style.display = "flex";
        document.querySelector(".test-panel-open").style.display = "none";
        document.querySelector(".test-panel-close").style.display = "flex";
      }
      function closeDemo() {
        document.querySelector(".test-panel-content").style.display = "none";
        document.querySelector(".test-panel-open").style.display = "flex";
        document.querySelector(".test-panel-close").style.display = "none";
      }
    </script>
    <!-- *******  END：Demo ******* -->

    <!-- ******* 接入步骤 6（按需） - START：自定义地图元素（此为例子，具体使用场景请按实际） ******* -->
    <script>
        const CesiumMapBtn = document.getElementById('CesiumMapBtn')
        CesiumMapBtn.style.display = 'none'
        // 等地图实例准备好了，再展示地图定制按钮
        window.addEventListener('load', function () {
            window.FH2.subscribe('cesium-viewer-change', (key) => {
                if (window.FH2.cesiumViewer.global) {
                    CesiumMapBtn.style.display = 'inline-block'
                }
            })
        })
        // 示例：定制地图，给地图添加自定义文本
        function addCustomCesiumData() {
            for (const key in window.FH2.cesiumViewer) {
                if (Object.prototype.hasOwnProperty.call(window.FH2.cesiumViewer, key)) {
                    const ins = window.FH2.cesiumViewer[key].entities.add({
                        position: window.Cesium.Cartesian3.fromDegrees(113.93, 22.57, 50),
                        label: {
                            text: "用户自定义文本",
                        },
                    })
                }
            }
        }
    </script>
    <!-- ******* 接入步骤 6（按需） - END：自定义地图元素（此为例子，具体使用场景请按实际） ******* -->

    <!-- ******* 接入步骤 7（按需） - START：自定义主题 ******* -->
    <script>
        function changeTheme() {
            document.body.className = document.body.className ? '' : 'set-change-color'
        }
    </script>
    <!-- ******* 接入步骤 7（按需） - END：自定义主题 ******* -->
     
    <!-- ******* 接入步骤 8（按需） - START：事件 ******* -->
    <script>
       // 获取当前相机的 video 类型：红外('ir')、广角('wide')、变焦('zoom')  getVideoType
      // 接受参数：无
      // 返回结果：{videoType: "zoom", cameraIndex: '98-0-1'}
      // 注意：点击按钮  或者  通过快捷键都会触发；主摄直播需要开启并且正常直播状态下才会返回有效数据；可以搭配生命周期  cockpit:mounted 使用，确保驾驶舱成功挂载后使用
      function getVideoTypeTest() {
        if (cockpit1.getVideoType) {
          const data = cockpit1.getVideoType();
          document.querySelector(
            ".message-info"
          ).innerText = `视频类型：${JSON.stringify(data)}`;
        }
      }

      // 主摄直播画面截图 captureVideoFrame
      // 接受参数： 可选，{format: 'image/png', quality: 1}  默认值为 'image/png' 和 1，值参考 https://developer.mozilla.org/zh-CN/docs/Web/API/HTMLCanvasElement/toDataURL
      // 返回结果： {cameraIndex: '', imageUrl: '‘}  imageUrl 为 base64 数据r
      // 注意：主摄直播需要开启并且正常直播状态下才会返回有效数据；可以搭配生命周期  cockpit:mounted 使用，确保驾驶舱成功挂载后使用
      function captureVideoFrameTest() {
        if (cockpit1.captureVideoFrame) {
          const data = cockpit1.captureVideoFrame();
          document.querySelector(
            ".message-info"
          ).innerText = `截图：${JSON.stringify({
            imageUrl: data.imageUrl.slice(0, 15),
            cameraIndex: data.cameraIndex,
          })}`;
          document.querySelector(".massage-img").src = data.imageUrl;
        }
      }

    </script>
    <!-- ******* 接入步骤 8（按需） - END：事件 ******* -->
</body>

</html>
